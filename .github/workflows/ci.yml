name: CI

# Lints, tests and builds every pull request (yours and Dependabot's) before
# it reaches dev or main. deploy.yml only runs after a push, and only builds:
# without this workflow a pull request shows no checks at all.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Same as deploy.yml: pnpm caching and a frozen install both need a
          # committed pnpm-lock.yaml, which a scaffold made with --no-install
          # doesn't have. With one committed, pnpm freezes the install in CI
          # by itself.
          package-manager-cache: false
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
